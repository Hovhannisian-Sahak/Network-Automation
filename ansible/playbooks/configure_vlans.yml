---
- name: Create VLANs
  hosts: switches
  gather_facts: false
  tasks:
    - name: Configure VLANs
      cisco.ios.ios_config:
        parents: "vlan {{ item.id }}"
        lines: ["name {{ item.name }}"]
      loop: "{{ vlans }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"